[package]
name = "yuantu-appcontainer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Rpc", "Win32_System_Services", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WindowsFilteringPlatform"] }

[profile.release]
panic = "abort"
strip = true
lto = true
