name: Windows installation
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # The Windows suite is the slow part of a release (about 17 minutes on one runner at concurrency 2), so it runs
  # as three shards beside the packaging job instead of in front of it. `publish` needs both.
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # `npm test` includes the helper's PE-header contract, which reads the built binary rather than a
      # source file, so every shard builds it first.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sandbox/windows-sandbox/native -> target
      - run: npm run build:windows-sandbox
      # Report every failing file, as the CI gate does; the exit code is still non-zero on any failure.
      # Host teardown and the source index compete for I/O on hosted Windows runners.
      - run: npm test -- --shard=${{ matrix.shard }}/3 --concurrency=2 --timings=.scratch/windows-package-tests.ndjson
        env:
          FOUNDRY_TEST_CONTINUE_ON_FAILURE: '1'
          # Every Host appends its shutdown steps to its worker's artifacts (copied into .scratch/test-logs), so a
          # teardown timeout shows which step it was stuck in.
          FOUNDRY_TEST_SHUTDOWN_TRACE: '1'
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-tests-diagnostics-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            .scratch/test-logs/
            .scratch/windows-package-tests.ndjson

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
            if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Automatic releases require a stable package.json version (for example, 0.1.1)'
            }
            if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw "Release tag '$env:GITHUB_REF_NAME' must match package.json version 'v$version'"
            }
          }
      - run: npm ci
      - run: npm run typecheck
      # `package:windows` builds the sandbox helper itself; it only needs the toolchain.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sandbox/windows-sandbox/native -> target
      - run: npm run package:windows
      - name: Install in isolated directory
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/release/*-setup.exe | Select-Object -First 1
          ./scripts/verify-windows-install.ps1 -Installer $installer.FullName -InstallDirectory "$pwd/.scratch/中文 安装验证"
      # The packaged suites run once and hold an Electron app each: a stuck one must fail the step in minutes, and
      # `--test-force-exit` reports a failed test even when something it started is still keeping the runner up.
      - name: Installed desktop and bundled runtime
        timeout-minutes: 15
        id: installed-desktop
        shell: pwsh
        run: |
          $env:PACKAGED_TEST_DIRECTORY = "$pwd/.scratch/中文 安装验证"
          $env:PACKAGED_TEST_PROFILE = "$pwd/.scratch/安装保留 profile"
          $env:PACKAGED_TEST_WORKSPACE = "$pwd/.scratch/安装保留 workspace"
          $env:PACKAGED_TEST_INSTALLER = (Get-ChildItem dist/release/*-setup.exe | Select-Object -First 1).FullName
          node --test --test-force-exit tests/installed-desktop.smoke.mjs
      - name: Uninstall installed application
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$pwd/.scratch/中文 安装验证/YuanTu Agent.exe") {
            ./scripts/verify-windows-install.ps1 -Installer unused -InstallDirectory "$pwd/.scratch/中文 安装验证" -Uninstall
          }
      - name: Verify retained user data
        if: always() && steps.installed-desktop.outcome == 'success'
        shell: pwsh
        run: |
          if (-not (Test-Path "$pwd/.scratch/安装保留 workspace/.yuantu/sessions.sqlite")) { throw 'Session data was not retained' }
      - name: Build an isolated upgrade candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .scratch/p1 -Force | Out-Null
          Copy-Item dist/release/win-unpacked .scratch/p1/dev03-old-application -Recurse
          $versionParts = ((Get-Content package.json -Raw | ConvertFrom-Json).version).Split('.')
          $nextVersion = "$($versionParts[0]).$($versionParts[1]).$([int]$versionParts[2] + 1)"
          npx electron-builder --config electron-builder.config.cjs --config.directories.output=.scratch/p1/upgrade-release --config.extraMetadata.version=$nextVersion --win --x64
          node scripts/write-release-manifest.mjs .scratch/p1/upgrade-release
      - name: Native desktop upgrade and retained credentials
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:UPGRADE_TEST_INSTALLER = (Get-ChildItem .scratch/p1/upgrade-release/*-setup.exe | Select-Object -First 1).FullName
          node --test --test-force-exit tests/desktop-upgrade.smoke.mjs
      - name: Old desktop and compatible database recovery
        timeout-minutes: 15
        shell: pwsh
        run: |
          # The upgrade smoke keeps its evidence in the system temp directory (`mkdtemp(tmpdir(), 'yuantu-upgrade-')`).
          $journals = Join-Path ([IO.Path]::GetTempPath()) 'yuantu-upgrade-*/用户 profile/upgrades/*/upgrade.json'
          $env:UPGRADE_TEST_JOURNAL = (Get-ChildItem $journals | Select-Object -First 1).FullName
          if (-not $env:UPGRADE_TEST_JOURNAL) { throw 'Upgrade recovery record was not created' }
          node --test --test-force-exit tests/desktop-rollback.smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: YuanTu-Agent-Windows-x64
          if-no-files-found: error
          path: |
            dist/release/*-setup.exe
            dist/release/*-setup.exe.json

  publish:
    needs: [windows-tests, windows-x64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YuanTu-Agent-Windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $installer = "release/YuanTu-Agent-$version-windows-x64-setup.exe"
          Get-Item -LiteralPath $installer, "$installer.json" -ErrorAction Stop | Out-Null
          # gh uploads both assets to a draft before publishing; existing releases are not overwritten.
          gh release create $env:RELEASE_TAG $installer "$installer.json" --verify-tag --generate-notes --title "YuanTu Agent $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
