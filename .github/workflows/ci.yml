# CI for YuanTu Agent.
#
# The `desktop-smoke` job is Windows-verified: `npm run smoke:desktop` launches a
# real Electron window through Playwright, so it needs a real graphical desktop
# and a Chromium/Electron install. It must not be moved to a headless runner
# without re-verifying it there.
#
# Some tests skip themselves, with a stated reason, when an external dependency
# is absent — that is expected behaviour, not a failure:
#   - the real-language-server section of tests/lsp.test.ts needs a real language server on PATH
#   - native sandbox kernel tests require their matching operating system
#   - Office tests need a local Microsoft Office install
#   - Chromium-dependent tests need Playwright's browser download
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'all, or only desktop-smoke (no check/bench/coverage/native-macos)'
        type: choice
        options: [all, desktop-smoke]
        default: all
# Desktop-smoke-only runs: a manual run with jobs=desktop-smoke. A pull request and a manual jobs=all run execute
# every job before anything reaches main.
permissions:
  contents: read
# A newer push to the same branch makes the older run's result moot, so it is cancelled rather than finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Skipped in a desktop-smoke-only run (see the note above `permissions`); bench, coverage and native-macos
    # need it and are skipped with it.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.jobs == 'desktop-smoke') }}
    runs-on: ubuntu-latest
    # Linux runs the portable/host contract suite; product native backends target
    # Windows and macOS and must not silently fall back on this runner.
    env:
      YUANTU_SANDBOX: host
      # A gate must report every failing file, not just the first one: fail-fast is the local loop, this is the
      # run whose output somebody reads to decide what to fix. The exit code is still non-zero on any failure.
      FOUNDRY_TEST_CONTINUE_ON_FAILURE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Browser runtime for browser-tool regressions
        run: npx playwright install --with-deps chromium
      # The aggregate is the entry point, and that is the point: `check` is what the README tells a developer to
      # run and what every gate is added to. Web and public SDK smoke are temporarily paused;
      # the internal client smoke remains active. `docs:check` and `references:check` inside it are what
      # make the numbers and the paths in the documentation fail here rather than in a reader's browser.
      - run: npm run check
      # The advisory gate is a CI step rather than part of `check`, because it reads npm's registry: a local
      # `npm run check` must stay usable offline. Every accepted advisory is listed in scripts/check-audit.mjs
      # with its reason, and an entry that stops being reported fails as stale.
      - run: npm run audit:check

  # The benchmark gate. Every rule is deterministic (schema bytes, publish counts, records per message) or a
  # ratio measured inside the run itself (batched against per-message commits, cached against cold folds), so
  # it means the same thing on a runner as it does locally. A machine-relative timing threshold would not.
  bench:
    needs: check
    runs-on: ubuntu-latest
    env:
      YUANTU_SANDBOX: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run bench:check

  # Coverage is a floor, not a badge: the suite already covers what it covers, and this job exists so a
  # change that deletes a whole area's tests cannot land quietly. The floor is deliberately below the
  # measured value so it catches a collapse, not drift.
  coverage:
    needs: check
    runs-on: ubuntu-latest
    env:
      YUANTU_SANDBOX: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run coverage

  # The Windows and macOS jobs are the slow ones. A feature-branch push runs only the Linux jobs; main, a pull
  # request, or a manual run (workflow_dispatch on the branch) runs these too.
  desktop-smoke:
    needs: check
    # Normally after a passing check (main, a pull request, or a manual run); in a desktop-smoke-only run, alone.
    if: >-
      !cancelled() && (
      (needs.check.result == 'success' && (github.ref == 'refs/heads/main' || github.event_name != 'push')) ||
      (github.event_name == 'workflow_dispatch' && inputs.jobs == 'desktop-smoke'))
    runs-on: windows-latest
    # A hung sandbox helper used to run the acceptance step into its per-test timeouts for ~20 minutes. The
    # ceiling bounds that; it is set above a healthy run, whose full duration has not been measured yet.
    timeout-minutes: 40
    continue-on-error: false
    env:
      # The UI suites launch real windows one after another; a single flaky assertion must not hide the rest.
      FOUNDRY_TEST_CONTINUE_ON_FAILURE: '1'
      FOUNDRY_TEST_WINDOWS_ACCOUNT_JOURNEYS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Windows platform regressions
        run: node scripts/run-tests.mjs tests/desktop-installation.test.ts tests/windows-install-safety.test.ts tests/native-sandbox-bundle.test.ts tests/desktop-sandbox-probe.test.ts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tools/windows-sandbox/native -> target
      - name: Windows sandbox helper safety and refusal regressions
        run: |
          npm run build:windows-sandbox
          cargo test --locked --manifest-path packages/tools/windows-sandbox/native/Cargo.toml
          node scripts/run-tests.mjs tests/windows-sandbox-setup.test.ts tests/sandbox-started.test.ts tests/acceptance.test.ts tests/native-git.test.ts
      - run: npm run build
      # Electron's lazy installation writes into node_modules, outside an isolated test worker's ownership.
      - name: Prepare Electron before isolated desktop tests
        run: node node_modules/electron/install.js
      - name: Initialize sandbox accounts on the disposable Actions runner
        id: account-setup
        run: node scripts/windows-account-ci.mjs setup
      - name: Windows account backend journeys without skips
        run: npm run check:windows-sandbox
      - name: Windows desktop account sandbox real acceptance without skips
        run: node scripts/check-windows-sandbox.mjs --desktop
      # Product-default suites explicitly select native; portable UI fixtures retain their isolated host setup.
      - name: Desktop smoke with initialized Windows sandbox accounts
        run: npm run smoke:desktop
        env:
          YUANTU_SANDBOX: native
      - name: Remove sandbox accounts and recorded grants even after a failed setup or test
        if: always() && steps.account-setup.outcome != 'skipped' && steps.account-setup.outcome != ''
        run: node scripts/windows-account-ci.mjs cleanup

  native-macos:
    needs: check
    if: github.ref == 'refs/heads/main' || github.event_name != 'push'
    runs-on: macos-latest
    env:
      FOUNDRY_TEST_CONTINUE_ON_FAILURE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # This job runs the actual Seatbelt kernel probes, rather than counting
      # platform skips on Windows/Linux as macOS acceptance.
      - name: macOS process and scratch ownership acceptance
        run: node scripts/check-macos-sandbox.mjs
      - name: macOS native sandbox regressions
        run: node scripts/run-tests.mjs tests/sandbox-seatbelt.test.ts tests/native-sandbox-migration.test.ts tests/native-background-cleanup.test.ts tests/native-sandbox-lifecycle.test.ts tests/sandbox-providers.test.ts tests/restricted-consumers.test.ts tests/restricted-consumers-native.test.ts tests/macos-packaging.test.ts tests/native-sandbox-bundle.test.ts tests/desktop-sandbox-probe.test.ts
      # A local unsigned app checks bundled runtime preparation and packaging.
      # Signing, notarization and both architecture releases remain separate gates.
      - run: npm run package:macos:dir
