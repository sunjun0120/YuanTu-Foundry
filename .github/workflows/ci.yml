# TEMPORARY diagnostic branch.
name: CI
on:
  push:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      YUANTU_SANDBOX: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          for i in 1 2 3; do
            node benchmarks/diag-append.mjs
            PRE=1 node benchmarks/diag-append.mjs
            READER=1 node benchmarks/diag-append.mjs
            PRE=1 READER=1 node benchmarks/diag-append.mjs
            TOOLS=1 node benchmarks/diag-append.mjs
          done
