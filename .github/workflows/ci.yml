# TEMPORARY diagnostic branch: distribution of the append.perRound ratio on the Linux runner.
name: CI
on:
  push:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      YUANTU_SANDBOX: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: for i in 1 2 3 4 5 6; do node benchmarks/diag-append.mjs; done
      - run: for i in 1 2 3 4 5 6 7 8; do node benchmarks/run.mjs | grep -E '^append\.perRound'; done
