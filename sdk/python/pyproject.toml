[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuantu-agent"
version = "0.1.0"
description = "Thin asynchronous client for an installed YuanTu Agent Host v1"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["yuantu_agent*"]
